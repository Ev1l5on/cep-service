spring.application.name=cep-service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cep_service}
spring.datasource.username=${POSTGRES_USER:cep_service}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br/ws}
viacep.connect-timeout-ms=${VIACEP_CONNECT_TIMEOUT_MS:2000}
viacep.read-timeout-ms=${VIACEP_READ_TIMEOUT_MS:5000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=1000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=15000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_AUDIT_GROUP_ID:cep-service-auditoria-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=10s

auditoria.kafka.topic=${KAFKA_AUDIT_TOPIC:cep-consultas-v1}
auditoria.kafka.dlt-topic=${KAFKA_AUDIT_DLT_TOPIC:cep-consultas-v1.DLT}
auditoria.publisher.queue-capacity=${KAFKA_AUDIT_QUEUE_CAPACITY:1000}
auditoria.consumer.max-retries=${KAFKA_AUDIT_MAX_RETRIES:2}
auditoria.consumer.retry-interval-ms=${KAFKA_AUDIT_RETRY_INTERVAL_MS:1000}
