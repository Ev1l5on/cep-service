services:
  app:
    image: cep-service:local
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cep_service}
      POSTGRES_USER: ${POSTGRES_USER:-cep_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_AUDIT_GROUP_ID: ${KAFKA_AUDIT_GROUP_ID:-cep-service-auditoria-v1}
      KAFKA_AUDIT_TOPIC: ${KAFKA_AUDIT_TOPIC:-cep-consultas-v1}
      KAFKA_AUDIT_DLT_TOPIC: ${KAFKA_AUDIT_DLT_TOPIC:-cep-consultas-v1.DLT}
      KAFKA_AUDIT_QUEUE_CAPACITY: ${KAFKA_AUDIT_QUEUE_CAPACITY:-1000}
      KAFKA_AUDIT_MAX_RETRIES: ${KAFKA_AUDIT_MAX_RETRIES:-2}
      KAFKA_AUDIT_RETRY_INTERVAL_MS: ${KAFKA_AUDIT_RETRY_INTERVAL_MS:-1000}
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br/ws}
      VIACEP_CONNECT_TIMEOUT_MS: ${VIACEP_CONNECT_TIMEOUT_MS:-2000}
      VIACEP_READ_TIMEOUT_MS: ${VIACEP_READ_TIMEOUT_MS:-5000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 1.0

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cep_service}
      POSTGRES_USER: ${POSTGRES_USER:-cep_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
  kafka_data:
